[project]
name = "switch2-harness"
version = "0.1.0"
description = "Drive a Nintendo Switch 2 via an ESP32-S3 USB gamepad bridge and watch it via a capture card"
requires-python = ">=3.11"
dependencies = [
    "pyserial>=3.5",
    "opencv-python>=4.10",
    "numpy>=1.26",
    "mcp>=1.2,<2",
]

[project.scripts]
s2h = "switch2_harness.cli:main"
s2h-mcp = "switch2_harness.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
