[project]
name = "generic-hardware-harness"
version = "0.1.0"
description = "Drive a USB-HID host device (console, PC, ...) via an ESP32-S3 gamepad/keyboard/mouse bridge and watch it via a capture card"
requires-python = ">=3.11"
dependencies = [
    "pyserial>=3.5",
    "opencv-python>=4.10",
    "numpy>=1.26",
    "mcp>=1.2,<2",
]

[project.scripts]
hwh = "hardware_harness.cli:main"
hwh-mcp = "hardware_harness.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hardware_harness"]
