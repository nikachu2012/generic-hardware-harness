[env:esp32s3]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
; upload/monitor port is auto-detected; override with `pio run -t upload --upload-port <port>`
; or the PLATFORMIO_UPLOAD_PORT environment variable.
upload_speed = 921600
monitor_speed = 921600
; Native USB = TinyUSB device (to Switch), UART0 via CH343 bridge = host link
build_unflags =
    -DCORE_DEBUG_LEVEL=1
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
build_flags =
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DCORE_DEBUG_LEVEL=0
